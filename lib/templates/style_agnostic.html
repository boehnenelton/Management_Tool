<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{title}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 1.5rem; }
    .bejson-cms-article { width: 100%; max-width: 900px; margin: 0 auto; }
    img { max-width: 100% !important; height: auto !important; display: block; }
    pre, code, table, div { max-width: 100% !important; overflow-x: auto; }
    .table-container { width: 100%; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 1.5rem 0; }
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    th, td { padding: 10px 14px; text-align: left; }
    pre { padding: 1.25rem; overflow-x: auto; margin-bottom: 1.5rem; }
    blockquote { margin: 1.5rem 0; padding: 1rem 1.25rem; border-left: 4px solid #DE2626; }
    .callout { border-left: 4px solid #DE2626; padding: 1rem 1.25rem; margin: 1.5rem 0; }
    .callout-note { border-left-color: #2563EB; }
    .callout-tip { border-left-color: #16A34A; }
    .callout-important { border-left-color: #7C3AED; }
    .callout-warning { border-left-color: #D97706; }
    .callout-caution { border-left-color: #DC2626; }
    .task-list { list-style: none; padding-left: 0; }
    .task-item { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.35rem; }
  </style>
</head>
<body>
<article class="bejson-cms-article">
{content}
</article>
</body>
</html>
